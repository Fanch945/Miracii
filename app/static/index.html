<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161310" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Miracii" />
    <title>Miracii</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="icon" href="/static/favicon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/static/favicon.jpg" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="stylesheet" href="/static/app.css?v=0.0.7" />
  </head>
  <body>
    <div class="workspace">
      <div class="shell">
        <header class="top">
          <div class="identity">
            <img class="mark" src="/static/favicon.jpg" alt="" />
            <div>
              <h1 id="persona-name">Miracii</h1>
              <p id="status-line" class="status">专属对话</p>
            </div>
          </div>
          <div class="actions">
            <label class="sr-only" for="persona-select">人格</label>
            <select id="persona-select"></select>
            <button id="studio-btn" class="ghost" type="button">设定</button>
            <button id="console-btn" class="ghost" type="button">日志</button>
            <button id="refresh-btn" class="ghost" type="button" title="从记录重新载入对话，不会删除已经巩固的内容">
              刷新
            </button>
            <button id="clear-btn" class="ghost" type="button" title="只能撤回尚未写入记忆的句子">
              撤回未巩固
            </button>
          </div>
        </header>

        <div id="hold-bar" class="hold-bar" hidden>
          <span>设定编辑中，回复和巩固已暂停。</span>
          <a id="hold-edit" href="/studio">回到编辑</a>
          <button id="hold-resume" class="ghost" type="button">恢复运行</button>
        </div>

        <main id="thread" class="thread" aria-live="polite">
          <p class="empty" id="empty-hint">还没有话。从下面那一行开始。</p>
        </main>

        <form id="composer" class="composer">
          <input id="image-input" class="sr-only" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple />
          <div class="compose-main">
            <div id="previews" class="previews" hidden></div>
            <label class="sr-only" for="input">输入</label>
            <textarea
              id="input"
              rows="1"
              placeholder="说一句… 也可以贴图"
              autocomplete="off"
              maxlength="4000"
            ></textarea>
          </div>
          <div class="compose-actions">
            <button id="attach-btn" class="ghost attach" type="button" title="发图">图</button>
            <button id="send-btn" type="submit">发送</button>
          </div>
        </form>
      </div>

      <div id="toasts" class="toasts" aria-live="polite"></div>
      <section class="dock" id="dock">
        <div id="dock-resize" class="dock-resize" title="拖高日志"></div>
        <header class="dock-bar">
          <button id="dock-toggle" type="button">日志</button>
          <label class="sr-only" for="dock-mode">日志类别</label>
          <select id="dock-mode">
            <option value="memory">记忆</option>
            <option value="runtime">监督</option>
          </select>
          <span id="dock-hint"></span>
          <button id="dock-jump" class="ghost" type="button">看监督</button>
          <button id="dock-refresh" class="ghost" type="button">刷新</button>
        </header>
        <div class="dock-body">
          <aside class="dock-tree" id="file-tree"></aside>
          <div class="dock-main">
            <div class="dock-meta" id="file-meta">还没有打开文件</div>
            <pre class="dock-view" id="file-view"></pre>
            <form id="dock-cmd" class="dock-cmd">
              <span aria-hidden="true">›</span>
              <label class="sr-only" for="cmd-input">控制台命令</label>
              <input
                id="cmd-input"
                autocomplete="off"
                spellcheck="false"
                placeholder="help  ·  ls  ·  open 文件id"
              />
            </form>
          </div>
        </div>
      </section>
    </div>
    <script src="/static/app.js?v=0.0.5"></script>
    <script src="/static/console.js?v=0.0.6"></script>
  </body>
</html>
